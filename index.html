<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gato vs Cachorro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ui">
    <div id="hud">
    </div>
    <div id="controls">
  <button id="startBtn">Iniciar</button>
      <button id="restartBtn">Reiniciar</button>
      <button id="themeBtn">Switch to Liz vs Maysa</button>
      <button id="clearRankingBtn">Limpar Ranking</button>
  <label style="margin-left:12px;">Gatos: <input id="numCats" type="text" value="10" /></label>
  <label style="margin-left:12px;">Cachorros: <input id="numDogs" type="text" value="10" /></label>
  <label style="margin-left:12px;">Calopsitas: <input id="numBirds" type="text" value="10" /></label>
  <label style="margin-left:12px;">Peixes: <input id="numFish" type="text" value="10" /></label>
      <span id="timer" style="margin-left:12px; font-weight:bold;">Tempo: 0:00</span>
      <button id="historyBtn" style="margin-left:12px;">📜</button>
      <label style="margin-left:12px;"><input type="checkbox" id="autoRestartCb"> Auto Restart</label>
    </div>
    <div id="historyMenu" style="display:none; position:fixed; top:100px; left:50%; transform:translateX(-50%); background:white; border:1px solid #ccc; padding:10px; max-height:200px; overflow-y:auto; z-index:1000;"></div>
  </div>
  <main>
    <div id="canvas-container"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="audio.js"></script>
  <!-- Species loader: usa ES modules para importar as definições de espécie
    e expô-las em window.Species. Mantivemos os arquivos *.global.js no
    repositório apenas como fallback/compatibilidade; o loader é a fonte
    de verdade (single source of truth) para as fábricas/abilities. -->
  <script type="module" src="scripts/species/loader.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
