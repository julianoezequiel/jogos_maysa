<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gato vs Cachorro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ui">
    <div id="hud">
      <div id="catHealth">Gato: 100</div>
      <div id="dogHealth">Cachorro: 100</div>
      <div id="message"></div>
    </div>
    <div id="matchConfig">
      <label>Gatos: <input id="numCats" type="number" value="1" min="1" max="6" /></label>
      <label>Cachorros: <input id="numDogs" type="number" value="1" min="1" max="6" /></label>
    </div>
    <div id="controls">
  <button id="startBtn">Iniciar</button>
      <button id="restartBtn">Reiniciar</button>
      <label style="margin-left:12px;">Sim runs: <input id="simRuns" type="number" value="50" min="1" max="1000" style="width:80px"/></label>
      <button id="simulateBtn">Simular</button>
    </div>
  </div>
  <div id="simResults" style="padding:8px 12px; font-size:13px; color:#222;"></div>
  <main>
    <div id="canvas-container"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="audio.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
