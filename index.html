<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gato vs Cachorro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ui">
    <div id="hud">
      <div id="catHealth">Gato: 100</div>
      <div id="dogHealth">Cachorro: 100</div>
      <div id="message"></div>
    </div>
    <div id="abilities">
      <label>Habilidade:</label>
      <select id="abilitySelect">
        <option value="auto">Aleatória</option>
        <option value="Scratch">Scratch</option>
        <option value="Purr Heal">Purr Heal</option>
        <option value="Feline Fury">Feline Fury</option>
        <option value="Nine Lives">Nine Lives</option>
      </select>
      <button id="attackBtn">Atacar</button>
    </div>
    <div id="controls">
      <button id="startBtn">Iniciar</button>
      <button id="restartBtn">Reiniciar</button>
    </div>
  </div>
  <main>
    <div id="canvas-container"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="audio.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
