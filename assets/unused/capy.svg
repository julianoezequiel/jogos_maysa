<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Simple stylized capybara SVG for in-game use -->
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfa16a"/>
      <stop offset="100%" stop-color="#b27a44"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <!-- body -->
  <ellipse cx="100" cy="70" rx="70" ry="36" fill="url(#g)" stroke="#6b3f20" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="45" cy="62" rx="30" ry="24" fill="url(#g)" stroke="#6b3f20" stroke-width="3"/>
  <!-- snout -->
  <rect x="30" y="70" width="32" height="12" rx="6" fill="#8f5a33" stroke="#6b3f20" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="36" cy="56" r="3" fill="#231815"/>
  <circle cx="54" cy="56" r="3" fill="#231815"/>
  <!-- small ears -->
  <ellipse cx="32" cy="44" rx="6" ry="4" fill="#9b6237"/>
  <ellipse cx="58" cy="44" rx="6" ry="4" fill="#9b6237"/>
  <!-- feet -->
  <ellipse cx="45" cy="98" rx="10" ry="6" fill="#8f5a33"/>
  <ellipse cx="120" cy="98" rx="10" ry="6" fill="#8f5a33"/>
</svg>
